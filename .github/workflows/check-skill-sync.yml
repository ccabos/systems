name: Check agent-skill reference sync

# The agent skill ships as a self-contained bundle, so projects/agent-skill/
# reference/ mirrors part of knowledge/. knowledge/ is canonical; the mirror
# is generated. This job fails if the two have drifted.

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - run: python3 scripts/sync-agent-skill-reference.py --check
